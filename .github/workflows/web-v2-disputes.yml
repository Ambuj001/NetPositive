name: Web v2 disputes
on:
  push:
    branches: [frontened-2]
    paths: ['apps/web-v2/**', '.github/workflows/web-v2-disputes.yml']
  pull_request:
    paths: ['apps/web-v2/**', '.github/workflows/web-v2-disputes.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web-v2/package-lock.json
      - run: npm ci
        working-directory: apps/web-v2
      - run: npm test
        working-directory: apps/web-v2
      - run: npm run build
        working-directory: apps/web-v2
