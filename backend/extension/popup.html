<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NetPositive Voucher Check</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font: 14px system-ui, sans-serif; margin: 0; padding: 16px; color: #1c1c1a; background: #faf8f3; }
    h1 { font-size: 15px; margin: 0 0 4px; }
    p.note { margin: 0 0 12px; color: #5b5b55; font-size: 12px; }
    label { display: block; margin: 8px 0 2px; font-size: 12px; color: #5b5b55; }
    input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #c9c6bb; border-radius: 6px; font: inherit; }
    button { margin-top: 12px; width: 100%; padding: 10px; border: 0; border-radius: 999px; background: #1c1c1a; color: #fff; font: inherit; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #status { display: none; margin-top: 12px; font-size: 12px; color: #5b5b55; }
    #out { margin-top: 14px; padding: 10px; border-radius: 8px; border: 1px solid #c9c6bb; display: none; }
    #out.ok { border-color: #2f7a4d; background: #eaf4ee; }
    #out.bad { border-color: #b3382c; background: #fbeceb; }
    #out b { display: block; margin-bottom: 4px; }
    #out div { font-size: 12px; }
  </style>
</head>
<body>
  <h1>Voucher check</h1>
  <p class="note">Checks the voucher on Woohoo in a background tab, using your own login. The code never leaves this device. You must be logged in to woohoo.in.</p>
  <form id="f" autocomplete="off">
    <label for="code">Card number</label>
    <input id="code" inputmode="numeric" required />
    <label for="pin">PIN</label>
    <input id="pin" type="password" inputmode="numeric" required />
    <label for="amt">Expected amount in ₹ (optional, fails the check if the balance is lower)</label>
    <input id="amt" inputmode="decimal" placeholder="e.g. 5000" />
    <button id="go" type="submit">Check voucher</button>
  </form>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="out" role="status" aria-live="polite"></div>
  <script src="src/normalize.js"></script>
  <script src="popup.js"></script>
</body>
</html>
