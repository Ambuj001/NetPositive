[profile.default]
src = "contracts/src"
test = "contracts/test-foundry"
script = "contracts/script"
out = "contracts/out"
cache_path = "contracts/cache"
libs = ["apps/arc-escrow/lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = ["forge-std/=apps/arc-escrow/lib/forge-std/src/", "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]
